<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expedition · Peaks to Brews to Ballparks</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<!-- One page renders every expedition: expedition.html?id=<id from data.js> -->
<body data-page="expedition">

  <section class="hero hero--short">
    <div class="hero-media" id="exp-hero"></div>
    <div class="hero-content">
      <span class="tag" id="exp-tag"></span>
      <h1 id="exp-title"></h1>
      <p class="lead" id="exp-summary"></p>
    </div>
  </section>

  <section class="facts">
    <div class="container facts-grid" id="exp-facts"></div>
  </section>

  <section class="section">
    <div class="container">
      <div class="story">
        <span class="eyebrow">The Log</span>
        <h2>Field Notes</h2>
        <div id="exp-story"></div>
      </div>
    </div>
  </section>

  <section class="section section--alt" id="gallery-section">
    <div class="container">
      <div class="section-head"><div><span class="eyebrow">Gallery</span><h2>Photos</h2></div></div>
      <div class="gallery" id="exp-gallery"></div>
      <nav class="pager" id="exp-pager"></nav>
    </div>
  </section>

  <div class="lightbox" id="lightbox" role="dialog" aria-label="Photo viewer">
    <button class="lb-close" aria-label="Close">×</button>
    <button class="lb-prev" aria-label="Previous">‹</button>
    <img src="" alt="">
    <button class="lb-next" aria-label="Next">›</button>
  </div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/fourteeners.js"></script>
  <script src="assets/js/ballparks.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
